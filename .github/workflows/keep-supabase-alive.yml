name: Keep Supabase alive

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase repeatedly
        env:
          BASE: https://enrbraxvxnytyfeuewqq.supabase.co/rest/v1
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          FAILED=0

          query () {
            local label="$1"
            local path="$2"
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "$BASE/$path" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY")
            echo "  $label -> $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              FAILED=1
            fi
          }

          # Several passes, spaced out, so activity is spread across the run
          for pass in 1 2 3 4 5 6; do
            echo "Pass $pass:"
            query "full peaks read"  "peaks?select=*"
            query "peaks count"      "peaks?select=id"
            query "collections"      "collections?select=*"
            query "collection_peaks" "collection_peaks?select=*&limit=1000"
            query "peaks sorted"     "peaks?select=id,name,height&order=height.desc&limit=500"
            if [ "$pass" -lt 6 ]; then
              sleep 20
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more queries failed"
            exit 1
          fi
          echo "All queries succeeded"
